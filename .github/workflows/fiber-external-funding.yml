name: fiber external funding test

on:
  workflow_dispatch:
    inputs:
      GitUrl:
        description: 'fiber git url used by make prepare'
        default: 'https://github.com/nervosnetwork/fiber.git'
      GitBranch:
        description: 'fiber git branch used by make prepare'
        default: 'develop'
      PrNumber:
        description: 'PR number used by prepare_pr.sh'
        default: '1120'
      TestPath:
        description: 'pytest path passed to make fiber_test_demo'
        default: 'test_cases/fiber/devnet/open_channel_with_external_funding'

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python 3.12
        uses: actions/setup-python@v3
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run make prepare
        run: make prepare
        env:
          GitUrl: '${{ github.event.inputs.GitUrl }}'
          GitBranch: '${{ github.event.inputs.GitBranch }}'

      - name: Build PR-specific fiber binaries
        run: bash prepare_pr.sh "${{ github.event.inputs.PrNumber }}"
        env:
          GitUrl: '${{ github.event.inputs.GitUrl }}'

      - name: Tar backup
        run: |
          rm -rf fiber
          tar -czf prepare-backup.tar.gz \
            download \
            source/ckb-cli

      - name: Backup data
        uses: actions/upload-artifact@v4
        with:
          name: external-funding-prepare-backup-${{ runner.os }}
          path: prepare-backup.tar.gz

  fiber_test_open_channel_with_external_funding:
    needs: prepare
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python 3.12
        uses: actions/setup-python@v3
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Download prepare backup
        uses: actions/download-artifact@v4
        with:
          name: external-funding-prepare-backup-${{ runner.os }}
          path: ./

      - name: Extract tarball and restore permissions
        run: |
          tar -xzf prepare-backup.tar.gz

      - name: Run external funding tests
        run: make fiber_test_demo FIBER_TEST_DEMO="${{ github.event.inputs.TestPath }}"

      - name: Publish reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: external-funding-reports-${{ runner.os }}
          path: |
            ./report
            ./pytest_output.txt
