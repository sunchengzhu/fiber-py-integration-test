name: Fiber LSP 手动回归
run-name: LSP 手动 · ${{ inputs.fiber_commit || 'PR 1623 最新 head' }}

on:
  workflow_dispatch:
    inputs:
      fiber_commit:
        description: Fiber commit（7～40 位 SHA）；留空使用 PR 1623 最新 head
        type: string
        required: false
        default: ''

permissions:
  contents: read

jobs:
  lsp:
    uses: sunchengzhu/fiber-py-integration-test/.github/workflows/lsp-ci.yml@fb8f31189c3abbed35a11dac5cf7c25ad4d8d61d
    with:
      fiber_commit: ${{ inputs.fiber_commit }}
      integration_commit: 'fb8f31189c3abbed35a11dac5cf7c25ad4d8d61d'
