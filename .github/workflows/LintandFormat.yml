name: Lint and Format

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint_and_format:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install black pylint

    - name: Run black
      run: black --check .

#    - name: Run pylint
#      run: pylint $(find . -name "*.py")

    - name: Format code
      run: |
        chmod +x format_code.sh
        ./format_code.sh

  daily_graph_sync_unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run daily graph-sync unit tests (no network)
      run: make daily_graph_sync_unit_test
